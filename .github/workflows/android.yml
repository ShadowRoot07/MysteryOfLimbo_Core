name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK con Verificación de Tamaño y Contenido
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # --- PASO 1: PREPARACIÓN ---
          mkdir -p java_src/org/libsdl/app java_src/com/shadowroot/mysteryoflimbo
          git clone --depth 1 https://github.com/libsdl-org/SDL.git sdl_temp
          cp -r sdl_temp/android-project/app/src/main/java/org/libsdl/app/* java_src/org/libsdl/app/
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/com/shadowroot/mysteryoflimbo/

          # --- PASO 2: COMPILACIÓN Y TEST DE CLASE ---
          mkdir -p obj
          find java_src -name "*.java" > java_files.txt
          javac -d obj -cp $PLATFORM @java_files.txt || (echo "❌ ERROR: Falló la compilación de Java" && exit 1)

          # TEST 1: ¿Existe el archivo .class?
          if [ ! -f obj/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.class ]; then
            echo "❌ ERROR CRÍTICO: MysteryOfLimboActivity.class no se generó."
            exit 1
          fi

          # --- PASO 3: DEX Y TEST DE D8 (REFACTORIZADO) ---
          mkdir -p dex_out
          # Generamos una lista de archivos .class con rutas absolutas
          find obj -name "*.class" > class_files.txt
          
          # Usamos --min-api 26 y pasamos los archivos uno por uno mediante la lista
          $TOOL_PATH/d8 --output dex_out/ \
                        --lib $PLATFORM \
                        --min-api 26 \
                        @class_files.txt || (echo "❌ ERROR: d8 falló" && exit 1)

          # TEST 2: Verificación con mayor tolerancia de búsqueda
          # Buscamos solo la palabra clave para ver qué nombre le puso d8
          echo "Contenido del DEX generado:"
          $TOOL_PATH/dexdump dex_out/classes.dex | grep "Class descriptor" | grep "MysteryOfLimbo" || \
          (echo "❌ ERROR: Tu clase sigue sin aparecer en el DEX. Intentando método de emergencia..." && exit 1)

          # --- PASO 4: ENSAMBLAJE ---
          $TOOL_PATH/aapt2 link -o raw.apk \
            --manifest android/app/src/main/AndroidManifest.xml \
            -I $PLATFORM -A assets/ --version-code 1 --version-name "1.0"

          mkdir stage
          cd stage && unzip ../raw.apk && rm -f classes.dex
          cp ../dex_out/classes.dex .
          
          mkdir -p lib/armeabi-v7a lib/arm64-v8a
          find ../build_android/armeabi-v7a -name "*.so" -exec cp {} lib/armeabi-v7a/ \;
          find ../build_android/arm64-v8a -name "*.so" -exec cp {} lib/arm64-v8a/ \;
          
          zip -r ../final_unaligned.apk .
          cd ..

          # --- PASO 5: DIAGNÓSTICO FORENSE (Try/Catch de Peso) ---
          DEX_SIZE=$(stat -c%s "dex_out/classes.dex")
          echo "Tamaño detectado: $DEX_SIZE bytes"

          if [ "$DEX_SIZE" -eq 92028 ]; then
            echo "⚠️ ALERTA: Peso crítico detectado (92028). Iniciando autopsia del DEX..."
            
            # 1. ¿Está la clase en la tabla de tipos?
            echo "--- Análisis de Símbolos ---"
            $TOOL_PATH/dexdump dex_out/classes.dex | grep -i "MysteryOfLimboActivity" || echo "❌ La clase NO existe en el binario."
            
            # 2. ¿Cuántas clases totales hay? (Comparar con un DEX vacío de SDL que tiene ~102 clases)
            CLASS_COUNT=$($TOOL_PATH/dexdump dex_out/classes.dex | grep "Class descriptor" | wc -l)
            echo "Total de clases en el DEX: $CLASS_COUNT"
            
            # 3. Ver las últimas 5 clases añadidas para ver si hubo truncamiento
            echo "--- Últimas clases en el índice ---"
            $TOOL_PATH/dexdump dex_out/classes.dex | grep "Class descriptor" | tail -n 5
            
            echo "❌ ERROR: El archivo tiene el peso de un build vacío a pesar de la inyección."
            echo "Esto sugiere que d8 reemplazó tu código con metadatos vacíos o hubo una colisión de nombres."
            exit 1
          else
            echo "✅ PESO VALIDADO: El archivo ha cambiado ($DEX_SIZE bytes)."
          fi

          # --- PASO 6: ALINEACIÓN ---
          mkdir -p bin
          $TOOL_PATH/zipalign -f -p 4 final_unaligned.apk bin/MysteryOfLimbo_Debug.apk
          echo "✅ APK Generado exitosamente con tamaño: $DEX_SIZE"

      - name: Commit y Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          git add bin/MysteryOfLimbo_V2.apk
          git commit -m "chore: V2 Build con clases separadas [skip ci]" || echo "No changes"
          git push --force origin ShadowRoot-CreateAPK

