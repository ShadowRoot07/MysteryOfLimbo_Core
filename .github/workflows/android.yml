name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK Profesional con AAPT2 y Java
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # 1. Crear estructura física IDÉNTICA a los paquetes
          mkdir -p java_src/org/libsdl/app
          mkdir -p java_src/com/shadowroot/mysteryoflimbo

          # 2. Descargar SDL y mover SOLO el código fuente
          git clone --depth 1 https://github.com/libsdl-org/SDL.git sdl_temp
          cp -r sdl_temp/android-project/app/src/main/java/org/libsdl/app/* java_src/org/libsdl/app/
          
          # 3. Mover TU actividad (Asegurando que la ruta coincida con el 'package')
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/com/shadowroot/mysteryoflimbo/

          # 4. Compilar usando una lista de archivos (Evita errores de ruta)
          mkdir -p obj
          find java_src -name "*.java" > sources.txt
          echo "Compilando los siguientes archivos:"
          cat sources.txt
          
          # Compilamos TODO. Si hay un solo error aquí, el build se detendrá.
          javac -d obj -cp $PLATFORM @sources.txt

          # 5. Generar DEX (Forzamos a d8 a procesar TODAS las clases en 'obj')
          mkdir -p bin_dex
          # El truco aquí es pasar el directorio 'obj' directamente para que d8 encuentre los paquetes
          $TOOL_PATH/d8 --output bin_dex/ --lib $PLATFORM --min-api 26 $(find obj -name "*.class")
          
          # 6. Vincular con AAPT2
          mkdir -p assets
          $TOOL_PATH/aapt2 link -o base.apk \
            --manifest android/app/src/main/AndroidManifest.xml \
            -I $PLATFORM \
            -A assets/ \
            --version-code 1 --version-name "1.0"

          # 7. Inyectar DEX en la RAÍZ (Garantizado)
          # Extraemos el dex si d8 lo sacó como carpeta o archivo
          cp bin_dex/classes.dex . || cp bin_dex/obj/classes.dex . || true
          zip -g base.apk classes.dex

          # 8. Inyectar TODAS las librerías nativas (SDL + Tu binario)
          mkdir -p lib/armeabi-v7a lib/arm64-v8a
          find build_android/armeabi-v7a -name "*.so" -exec cp {} lib/armeabi-v7a/ \;
          find build_android/arm64-v8a -name "*.so" -exec cp {} lib/arm64-v8a/ \;
          zip -r base.apk lib/

          # 9. Alineación final
          mkdir -p bin
          $TOOL_PATH/zipalign -f -p 4 base.apk bin/MysteryOfLimbo_Debug.apk

      - name: Commit y Push del APK al Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07 (via GitHub Actions)"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          git add bin/
          git commit -m "chore: build android binary [skip ci]" || echo "No hay cambios para subir"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ShadowRoot-CreateAPK

