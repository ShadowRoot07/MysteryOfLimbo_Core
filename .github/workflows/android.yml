name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK con Búsqueda Agresiva de SDL2
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # --- PASO 1: LIMPIEZA Y PREPARACIÓN ---
          rm -rf java_src obj dex_out sdl_temp sdl2.tar.gz
          mkdir -p java_src/com/shadowroot/mysteryoflimbo obj dex_out

          echo "📥 Descargando SDL 2.30.12..."
          curl -L https://github.com/libsdl-org/SDL/archive/refs/tags/release-2.30.12.tar.gz -o sdl2.tar.gz
          mkdir sdl_temp
          tar -xzf sdl2.tar.gz -C sdl_temp --strip-components=1

          # --- PASO 2: DIAGNÓSTICO DE ESTRUCTURA (LOGS) ---
          echo "🔍 Analizando contenido de la descarga (Nivel 3):"
          find sdl_temp -maxdepth 3 -type d
          
          echo "🔍 Buscando archivos Java de SDL..."
          # Buscamos todos los .java que estén dentro de una ruta que contenga 'org/libsdl/app'
          # y los copiamos manteniendo la estructura de directorios
          mkdir -p java_src/org/libsdl/app
          
          # Esta es la 'Red de Arrastre': busca y copia el contenido de la carpeta final
          find sdl_temp -type d -path "*/org/libsdl/app" -exec cp -r {}/. java_src/org/libsdl/app/ \;

          # Inyectamos tu actividad personalizada
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/com/shadowroot/mysteryoflimbo/

          # --- PASO 3: CONTEO Y VALIDACIÓN ---
          find java_src -name "*.java" > java_files.txt
          TOTAL_FILES=$(cat java_files.txt | wc -l)
          
          echo "--- 📋 LISTADO DE ARCHIVOS PARA COMPILAR ---"
          cat java_files.txt
          echo "-------------------------------------------"
          echo "Total de archivos Java encontrados: $TOTAL_FILES"

          if [ "$TOTAL_FILES" -lt 15 ]; then
            echo "❌ ERROR: La red de arrastre solo capturó $TOTAL_FILES archivos. Faltan clases de SDL2."
            exit 1
          fi

          echo "✅ Estructura validada. Iniciando javac..."
          javac -d obj -cp $PLATFORM @java_files.txt || (echo "❌ ERROR: Falló javac" && exit 1)

          # --- PASO 4: DEX Y EMPAQUETADO ---
          $TOOL_PATH/d8 --output dex_out/ --lib $PLATFORM --min-api 26 @class_files.txt 2>/dev/null || \
          $TOOL_PATH/d8 --output dex_out/ --lib $PLATFORM --min-api 26 $(find obj -name "*.class")

          DEX_SIZE=$(stat -c%s "dex_out/classes.dex")
          echo "Tamaño del DEX: $DEX_SIZE bytes"

          # Validación de seguridad para evitar el build vacío
          if [ "$DEX_SIZE" -le 93000 ] && [ "$DEX_SIZE" -ge 91000 ]; then
            echo "❌ ERROR: El DEX generado tiene el tamaño de un build vacío (92kb aprox)."
            exit 1
          fi

          # --- PASO 5: ALINEACIÓN (Uso de un APK base si existe o creación rápida) ---
          # Nota: Aquí asumimos que tienes un template o generas el zip. 
          # Por ahora, alineamos lo que salga para no romper el flujo.
          mkdir -p bin
          # (Asegúrate de que 'final_unaligned.apk' se genere antes o ajusta esta línea)
          # $TOOL_PATH/zipalign -f -p 4 final_unaligned.apk bin/MysteryOfLimbo_Debug.apk

      - name: Commit y Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          git add bin/MysteryOfLimbo_V2.apk
          git commit -m "chore: V2 Build con clases separadas [skip ci]" || echo "No changes"
          git push --force origin ShadowRoot-CreateAPK

