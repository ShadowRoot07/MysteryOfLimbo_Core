name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK - Estrategia 3 (Skeleton Injection)
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # --- PASO 1: LIMPIEZA ---
          rm -rf java_src obj dex_out
          mkdir -p java_src/org/libsdl/app java_src/com/shadowroot/mysteryoflimbo obj dex_out

          echo "📥 Descargando Set de Soporte SDL2..."
          # Lista de archivos críticos que suelen faltar en las descargas recortadas
          FILES=(
            "SDL.java" "SDLActivity.java" "SDLAudioManager.java" "SDLControllerManager.java"
            "SDLJoystickHandler.java" "SDLSurface.java" "SDLSensorHandler.java"
            "HIDDevice.java" "HIDDeviceManager.java" "HIDDeviceUSB.java" "HIDDeviceBLESteamController.java"
          )

          BASE_URL="https://raw.githubusercontent.com/libsdl-org/SDL/SDL2/android-project/app/src/main/java/org/libsdl/app"

          for file in "${FILES[@]}"; do
            echo "Descargando $file..."
            curl -sL "$BASE_URL/$file" -o "java_src/org/libsdl/app/$file"
          done

          # Inyectamos tu actividad
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/com/shadowroot/mysteryoflimbo/

          # --- PASO 2: CONTEO Y VALIDACIÓN ---
          find java_src -name "*.java" > java_files.txt
          TOTAL_FILES=$(cat java_files.txt | wc -l)
          
          echo "--- 📋 LISTADO DE ARCHIVOS OBTENIDOS ---"
          cat java_files.txt
          echo "-------------------------------------------"
          echo "Total de archivos Java: $TOTAL_FILES"

          # Ahora el mínimo es 12 (11 de SDL + la tuya)
          if [ "$TOTAL_FILES" -lt 12 ]; then
            echo "❌ ERROR: Falló la descarga de los archivos individuales."
            exit 1
          fi

          echo "✅ Esqueleto inyectado. Compilando..."
          javac -d obj -cp $PLATFORM @java_files.txt || (echo "❌ ERROR: Falló javac" && exit 1)

          # --- PASO 3: DEX ---
          find obj -name "*.class" > class_files.txt
          $TOOL_PATH/d8 --output dex_out/ --lib $PLATFORM --min-api 26 @class_files.txt

          DEX_SIZE=$(stat -c%s "dex_out/classes.dex")
          echo "✅ Tamaño final del DEX: $DEX_SIZE bytes"

      - name: Commit y Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          git add bin/MysteryOfLimbo_V2.apk
          git commit -m "chore: V2 Build con clases separadas [skip ci]" || echo "No changes"
          git push --force origin ShadowRoot-CreateAPK

