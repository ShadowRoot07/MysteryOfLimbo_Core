name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK Profesional (Aislamiento Total)
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # 1. Crear un área de trabajo limpia y absoluta para evitar colisiones
          mkdir -p work/src/org/libsdl/app
          mkdir -p work/src/com/shadowroot/mysteryoflimbo
          mkdir -p work/obj

          # 2. Descargar SDL y mover fuentes
          git clone --depth 1 https://github.com/libsdl-org/SDL.git sdl_temp
          cp -r sdl_temp/android-project/app/src/main/java/org/libsdl/app/* work/src/org/libsdl/app/
          
          # 3. Mover TU código (Ruta absoluta desde la raíz del repo)
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java work/src/com/shadowroot/mysteryoflimbo/

          # 4. Compilar (Forzamos a javac a decirnos qué está haciendo)
          # Ya no usamos 'find', listamos las rutas para que no haya pérdida
          javac -d work/obj -cp $PLATFORM \
            work/src/org/libsdl/app/*.java \
            work/src/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java

          # 5. Crear JAR y VALIDACIÓN CRÍTICA
          cd work/obj
          jar cvf ../../classes.jar .
          cd ../..
          
          # Si MysteryOfLimboActivity NO está en el JAR, el build se detiene aquí
          jar tf classes.jar | grep "MysteryOfLimboActivity" || (echo "ERROR: Tu clase no fue compilada" && exit 1)

          # 6. DEX (Procesamos el JAR completo)
          mkdir -p dex_out
          $TOOL_PATH/d8 --output dex_out/ --lib $PLATFORM --min-api 26 classes.jar
          
          # 7. Vincular Recursos
          $TOOL_PATH/aapt2 link -o raw.apk \
            --manifest android/app/src/main/AndroidManifest.xml \
            -I $PLATFORM -A assets/ --version-code 1 --version-name "1.0"

          # 8. Ensamblaje Manual (Limpieza de cualquier residuo)
          mkdir stage
          cd stage && unzip ../raw.apk && rm -f classes.dex
          cp ../dex_out/classes.dex .
          
          # Librerías
          mkdir -p lib/armeabi-v7a lib/arm64-v8a
          find ../build_android/armeabi-v7a -name "*.so" -exec cp {} lib/armeabi-v7a/ \;
          find ../build_android/arm64-v8a -name "*.so" -exec cp {} lib/arm64-v8a/ \;
          
          zip -r ../final_unaligned.apk .
          cd ..

          # 9. Alineación
          mkdir -p bin
          $TOOL_PATH/zipalign -f -p 4 final_unaligned.apk bin/MysteryOfLimbo_Debug.apk

      - name: Commit y Push del APK al Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07 (via GitHub Actions)"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          
          # Limpieza total para evitar el error de "unstaged changes"
          git checkout ShadowRoot-CreateAPK
          git reset --hard origin/ShadowRoot-CreateAPK
          
          # Añadir el binario generado
          git add -f bin/MysteryOfLimbo_Debug.apk
          
          # Commit y Push forzado para evitar conflictos de historial
          git commit -m "chore: update android binary [skip ci]" || echo "No changes"
          git push --force origin ShadowRoot-CreateAPK
          
