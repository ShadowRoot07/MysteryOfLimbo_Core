name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK - Estrategia 2 (Git Precision)
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # --- PASO 1: LIMPIEZA ---
          rm -rf java_src obj dex_out sdl_temp
          mkdir -p java_src/com/shadowroot/mysteryoflimbo obj dex_out

          echo "📥 Clonando SDL (Modo Espejo)..."
          # Clonamos solo la rama de SDL2 para ahorrar tiempo y espacio
          git clone --branch SDL2 --depth 1 https://github.com/libsdl-org/SDL.git sdl_temp

          echo "🔍 Verificando ubicación real de los archivos Java..."
          # Buscamos la ruta exacta donde residen los archivos en esta rama
          SDL_JAVA_PATH=$(find sdl_temp -type d -path "*/org/libsdl/app" | head -n 1)
          echo "Ruta encontrada: $SDL_JAVA_PATH"

          if [ -z "$SDL_JAVA_PATH" ]; then
            echo "❌ ERROR: No se encontró la ruta org/libsdl/app en la rama SDL2."
            exit 1
          fi

          # --- PASO 2: COPIA INTEGRAL ---
          cp -r "$SDL_JAVA_PATH/." java_src/
          
          # Inyectamos tu actividad
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/com/shadowroot/mysteryoflimbo/

          # --- PASO 3: CONTEO Y VALIDACIÓN ---
          find java_src -name "*.java" > java_files.txt
          TOTAL_FILES=$(cat java_files.txt | wc -l)
          
          echo "--- 📋 LISTADO DE ARCHIVOS ENCONTRADOS ---"
          cat java_files.txt
          echo "-------------------------------------------"
          echo "Total de archivos Java: $TOTAL_FILES"

          if [ "$TOTAL_FILES" -lt 18 ]; then
            echo "❌ ERROR: Seguimos con pocos archivos ($TOTAL_FILES). La rama SDL2 está incompleta."
            exit 1
          fi

          echo "✅ Estructura recuperada. Compilando..."
          javac -d obj -cp $PLATFORM @java_files.txt || (echo "❌ ERROR: Falló javac" && exit 1)

          # --- PASO 4: DEX ---
          find obj -name "*.class" > class_files.txt
          $TOOL_PATH/d8 --output dex_out/ --lib $PLATFORM --min-api 26 @class_files.txt

      - name: Commit y Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          git add bin/MysteryOfLimbo_V2.apk
          git commit -m "chore: V2 Build con clases separadas [skip ci]" || echo "No changes"
          git push --force origin ShadowRoot-CreateAPK

