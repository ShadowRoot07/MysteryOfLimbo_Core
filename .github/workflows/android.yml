name: Android Build (Mystery of Limbo)

on:
  push:
    branches: [ ShadowRoot-CreateAPK ]
  pull_request:
    branches: [ ShadowRoot-CreateAPK ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          # Compilamos para ambas arquitecturas para asegurar compatibilidad
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK (Método de Fusión Total)
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # 1. Limpieza absoluta
          mkdir -p java_src/sdl java_src/mine obj_sdl obj_mine
          
          # 2. Separar fuentes para asegurar que javac no se confunda
          git clone --depth 1 https://github.com/libsdl-org/SDL.git sdl_temp
          cp -r sdl_temp/android-project/app/src/main/java/org/libsdl/app/*.java java_src/sdl/
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/mine/

          # 3. COMPILACIÓN POR SEPARADO (Para ver si tu clase genera un .class real)
          javac -d obj_sdl -cp $PLATFORM java_src/sdl/*.java
          javac -d obj_mine -cp $PLATFORM:obj_sdl java_src/mine/*.java

          # Verificación: ¿Existe el archivo .class de tu actividad?
          ls -R obj_mine/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.class || exit 1

          # 4. CREAR DEX UNIFICADO
          # Pasamos AMBOS directorios de objetos directamente
          mkdir -p dex_out
          $TOOL_PATH/d8 --output dex_out/ \
                        --lib $PLATFORM \
                        --min-api 26 \
                        $(find obj_sdl -name "*.class") \
                        $(find obj_mine -name "*.class")

          # 5. ENSAMBLAJE MANUAL DESDE CERO
          $TOOL_PATH/aapt2 link -o raw.apk \
            --manifest android/app/src/main/AndroidManifest.xml \
            -I $PLATFORM -A assets/ --version-code 1 --version-name "1.0"

          mkdir stage
          cd stage && unzip ../raw.apk && rm -f classes.dex
          cp ../dex_out/classes.dex .
          
          # Librerías nativas
          mkdir -p lib/armeabi-v7a lib/arm64-v8a
          find ../build_android/armeabi-v7a -name "*.so" -exec cp {} lib/armeabi-v7a/ \;
          find ../build_android/arm64-v8a -name "*.so" -exec cp {} lib/arm64-v8a/ \;
          
          zip -r ../final_unaligned.apk .
          cd ..

          # 6. Alineación con NUEVO NOMBRE (Para romper el caché de GitHub y tu móvil)
          mkdir -p bin
          $TOOL_PATH/zipalign -f -p 4 final_unaligned.apk bin/MysteryOfLimbo_V2.apk

      - name: Commit y Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07"
          git config --global user.email "shadowroot07@users.noreply.github.com"
          git add bin/MysteryOfLimbo_V2.apk
          git commit -m "chore: V2 Build con clases separadas [skip ci]" || echo "No changes"
          git push --force origin ShadowRoot-CreateAPK

